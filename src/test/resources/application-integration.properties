spring.application.name=module-administration-integration-test

# PostgreSQL — URL/username/password surchargés par @DynamicPropertySource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.format_sql=false

# Liquibase désactivé (Hibernate crée le schéma)
spring.liquibase.enabled=false

# Port aléatoire
server.port=0

# Redis — connexion lazy, timeout court
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.timeout=100ms
spring.data.redis.connect-timeout=100ms

# Kafka — listeners non démarrés automatiquement
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.listener.auto-startup=false

# JWT
jwt.secret=2jYwWw8cM9mQm6lT8fY5HkN1sVxR4pUa7ZcD3eFg9LbQp1nJk6tSr8vUyA0oI5dM
jwt.access-token-expiration=9000000
jwt.refresh-token-expiration=604800000

# Mail (mockée dans AbstractIntegrationTest)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test

# Spring AI (non utilisée dans les tests IT)
spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://localhost:9999
spring.ai.openai.chat.options.model=test-model
spring.ai.openai.chat.options.temperature=0.3

# n8n webhook désactivé
n8n.webhook.enabled=false

# reCAPTCHA désactivé
recaptcha.enabled=false
recaptcha.secret-key=dummy
recaptcha.verify-url=http://localhost:9999
recaptcha.min-score=0.5

# OTP
otp.expiration-minutes=5
otp.length=6

# LLM (non utilisé dans les tests IT)
llm.base-url=http://localhost:9999
llm.api-key=test-key
llm.model=test-model
llm.temperature=0.3

# n8n
n8n.webhook.secret=test-secret
n8n.webhook.timeout-ms=1000

# Kafka consumer groups
spring.kafka.consumer.group-id=audit-test,notification-test
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=talan.pfe.rulengine.kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

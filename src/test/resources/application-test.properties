# H2 doesn't know Postgres jsonb by default; create a compatible domain for tests.
# Keep it simple: represent jsonb as VARCHAR in H2 tests.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS jsonb AS VARCHAR\;
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
# H2 treats unquoted "value" as reserved; quote identifiers in DDL for tests
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.liquibase.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.org.springframework=INFO

# ── Infrastructure (override localhost → Docker service names) ─
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:raas_platform}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.data.redis.host=${REDIS_HOST:host.docker.internal}
spring.data.redis.port=${REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:host.docker.internal:9092}

# ── Secrets injected via docker-compose env ────────────────────
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:9000000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

llm.base-url=${LLM_BASE_URL}
llm.api-key=${LLM_API_KEY}
llm.model=${LLM_MODEL:openai/gpt-oss-120b}
llm.temperature=${LLM_TEMPERATURE:0.3}

spring.ai.openai.api-key=${LLM_API_KEY}
spring.ai.openai.base-url=${LLM_BASE_URL}
spring.ai.openai.chat.options.model=${LLM_MODEL:openai/gpt-oss-120b}

tavily.api-key=${TAVILY_API_KEY}

spring.mail.host=${MAIL_HOST:mailhog}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

n8n.webhook.enabled=${N8N_WEBHOOK_ENABLED:false}
n8n.webhook.url=${N8N_WEBHOOK_URL:http://n8n:5678/webhook-test/ruleset-activated}
n8n.webhook.secret=${N8N_WEBHOOK_SECRET}
n8n.collect.webhook-url=${N8N_COLLECT_WEBHOOK_URL:http://n8n:5678/webhook/collect-agent}
n8n.ingest.secret=${N8N_INGEST_SECRET}

recaptcha.enabled=false

# Liquibase activé avec un changelog Docker dédié :
# JPA (ddl-auto=update) crée le schéma, Liquibase insère uniquement les données de démo.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-docker.yaml

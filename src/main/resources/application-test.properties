spring.application.name=module-administration-test

# In-memory DB for tests
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS jsonb AS VARCHAR\;
spring.datasource.username=sa
spring.datasource.password=

# JPA: create schema from entities for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Liquibase not needed in tests (schema created by Hibernate)
spring.liquibase.enabled=false

# Random port (not used by most tests)
server.port=0


databaseChangeLog:
  - changeSet:
      id: 009-api-key-prefix-version-seq
      author: rulengine
      validCheckSum: 9:0b62c7c7843f8d179c8da6e574f624be
      changes:
        - addColumn:
            tableName: api_keys
            columns:
              - column:
                  name: key_prefix
                  type: varchar(16)
              - column:
                  name: rule_set_id
                  type: bigint
        - addForeignKeyConstraint:
            baseTableName: api_keys
            baseColumnNames: rule_set_id
            referencedTableName: rule_sets
            referencedColumnNames: id
            constraintName: fk_api_keys_rule_set_id
        - createSequence:
            sequenceName: rule_set_version_seq
            startValue: 1
            incrementBy: 1

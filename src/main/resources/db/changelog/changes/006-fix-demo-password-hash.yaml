databaseChangeLog:
  - changeSet:
      id: 006-fix-demo-password-hash
      author: codex
      validCheckSum:
        - ANY
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: users
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              -- Set demo plaintext password for all demo users to: password123
              -- BCrypt hash generated with Spring Security BCryptPasswordEncoder:
              -- password123 -> $2a$10$Z4lwWM2slehESra3HP04c.abDAza28kgOoM4Ny2H2FjeXm.tFrlJW
              UPDATE users
              SET password_hash = '$2a$10$Z4lwWM2slehESra3HP04c.abDAza28kgOoM4Ny2H2FjeXm.tFrlJW'
              WHERE email IN (
                'mecherguiislem2@gmail.com',
                'viewer.bnp@demo.com',
                'admin.sg@demo.com',
                'manager.sg@demo.com',
                'admin.att@demo.com'
              );


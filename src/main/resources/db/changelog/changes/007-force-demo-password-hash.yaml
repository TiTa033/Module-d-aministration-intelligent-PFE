databaseChangeLog:
  - changeSet:
      id: 007-force-demo-password-hash
      author: codex
      runOnChange: true
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: users
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              -- Force demo plaintext password: password123
              -- BCrypt(password123) = $2a$10$Z4lwWM2slehESra3HP04c.abDAza28kgOoM4Ny2H2FjeXm.tFrlJW
              UPDATE users
              SET password_hash = '$2a$10$Z4lwWM2slehESra3HP04c.abDAza28kgOoM4Ny2H2FjeXm.tFrlJW'
              WHERE email IN (
                'mecherguiislem2@gmail.com',
                'viewer.bnp@demo.com',
                'admin.sg@demo.com',
                'manager.sg@demo.com',
                'admin.att@demo.com'
              );

